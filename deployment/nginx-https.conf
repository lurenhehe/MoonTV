server {
    listen 80;
    listen [::]:80;
    server_name dy.liyao03.dpdns.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dy.liyao03.dpdns.org;
    ssl_certificate /etc/nginx/certs/dy.liyao03.dpdns.org_cert.pem;
    ssl_certificate_key /etc/nginx/certs/dy.liyao03.dpdns.org_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location = /.well-known/moontv-origin {
        default_type text/plain;
        return 200 'moontv-vps-91.213.186.133\n';
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 180s;
        client_max_body_size 20m;
        add_header X-MoonTV-Origin vps-91.213.186.133 always;
    }
}
